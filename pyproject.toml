[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume_engine"
version = "0.1.0"
description = "Framework-agnostic deterministic execution layer for multi-step agent workflows (OrchestrateOS)"
readme = "resume_engine/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI Tech Pros", email = "hello@aitechpros.ai" }]
keywords = ["agents", "langchain", "langgraph", "crewai", "checkpointing", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
langgraph = ["langgraph>=0.0.20"]
crewai = ["crewai>=0.1.0"]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "httpx>=0.25.0"]
remote = ["httpx>=0.25.0"]
all = ["resume_engine[api,langgraph,crewai,dev,remote]"]

[project.urls]
Homepage = "https://orchestrateos.pages.dev"
Documentation = "https://github.com/AI-Tech-Pros/aitechpros-website/tree/main/resume_engine"
Repository = "https://github.com/AI-Tech-Pros/aitechpros-website"
Issues = "https://github.com/AI-Tech-Pros/aitechpros-website/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["resume_engine*"]

[tool.pytest.ini_options]
testpaths = ["resume_engine/tests"]
pythonpath = ["."]
