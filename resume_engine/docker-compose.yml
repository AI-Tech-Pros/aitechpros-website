services:
  api:
    build:
      context: ..
      dockerfile: resume_engine/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/resume_engine.db}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8000"
    volumes:
      - resume_engine_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    profiles:
      - postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume
      POSTGRES_DB: resume_engine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_engine"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-postgres:
    profiles:
      - postgres
    build:
      context: ..
      dockerfile: resume_engine/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://resume:resume@postgres:5432/resume_engine
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  resume_engine_data:
  postgres_data:
