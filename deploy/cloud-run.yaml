# Cloud Run service template for OrchestrateOS API
# Deploy: gcloud run services replace deploy/cloud-run.yaml --region=us-central1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: orchestrateos-api
  labels:
    product: orchestrateos
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/orchestrateos/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrateos-database-url
                  key: latest
            - name: LOG_LEVEL
              value: info
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
