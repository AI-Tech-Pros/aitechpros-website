name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "attached_assets/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "client/**"
      - "server/**"
      - "shared/**"
      - "attached_assets/**"
      - "patches/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "vite.config.ts"
      - "tsconfig*.json"
  workflow_dispatch:

concurrency:
  group: deploy-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          VITE_ORCHESTRATEOS_API_URL: ${{ vars.VITE_ORCHESTRATEOS_API_URL }}
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
          VITE_ANALYTICS_WEBSITE_ID: ${{ vars.VITE_ANALYTICS_WEBSITE_ID }}
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/public/index.html
          test -d dist/public/assets

      - uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: namecheap-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-public
          path: dist/public

      - name: Deploy to Namecheap (SFTP)
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.NAMECHEAP_FTP_SERVER }}
          username: ${{ secrets.NAMECHEAP_FTP_USERNAME }}
          ssh_private_key: ${{ secrets.NAMECHEAP_SSH_PRIVATE_KEY }}
          port: 21098
          local_path: "./dist/public/*"
          remote_path: "/home/aitevrpo/public_html/"
          sftp_only: true

      - name: Smoke test live site
        run: |
          curl -fsSI "https://aitechpros.ai/" | head -n 1
          curl -fsS "https://aitechpros.ai/" | grep -q "<!doctype html"
