name: Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "vite.config.ts"
      - ".env.orchestrateos"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PAGES_URL: https://aitechpros-website.pages.dev
  ORCHESTRATEOS_PAGES_URL: https://orchestrateos.pages.dev
  WORKER_API_URL: https://orchestrateos-api.nevaquit.workers.dev

jobs:
  pages-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy main site (Pages)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SITE_URL: https://aitechpros-website.pages.dev

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=aitechpros-website

  pages-orchestrateos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy OrchestrateOS (Pages)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:orchestrateos
        env:
          VITE_ORCHESTRATEOS_DEMO_KEY: ${{ secrets.ORCHESTRATEOS_DEMO_KEY }}

      - name: Publish OrchestrateOS to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=orchestrateos

      - name: Smoke test OrchestrateOS site
        run: curl -fsS "${{ env.ORCHESTRATEOS_PAGES_URL }}/" | grep -qi "<!doctype html"

  worker:
    runs-on: ubuntu-latest
    name: Deploy Worker API
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install worker dependencies
        working-directory: cloudflare/workers/orchestrateos-api
        run: npm ci

      - name: Apply D1 schema (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/schema.sql

      - name: Apply D1 governance migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0003_governance.sql

      - name: Apply D1 platform migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0004_platform.sql

      - name: Apply D1 tenant migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0005_tenant.sql

      - name: Apply D1 tenant backfill (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0006_tenant_backfill.sql

      - name: Apply D1 nurture migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0007_nurture.sql

      - name: Apply D1 kernel ops migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0008_kernel_ops.sql

      - name: Apply D1 tenant API keys migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0009_tenant_api_keys.sql

      - name: Apply D1 gate policies migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0010_gate_policies.sql

      - name: Seed D1 demo runs
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/seed.sql

      - name: Prepare Worker API keys
        working-directory: cloudflare/workers/orchestrateos-api
        env:
          ORCHESTRATEOS_API_KEY: ${{ secrets.ORCHESTRATEOS_API_KEY }}
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${ORCHESTRATEOS_API_KEY:-}" ] && [ -z "${API_KEYS_JSON:-}" ]; then
            echo "::error::Set ORCHESTRATEOS_API_KEY or API_KEYS_JSON in GitHub secrets"
            exit 1
          fi
          node scripts/merge-api-keys.mjs > .api-keys.json
          echo "Runner key length: $(node scripts/merge-api-keys.mjs --print-runner | wc -c | tr -d ' ')"

      - name: Sync Worker API secrets
        working-directory: cloudflare/workers/orchestrateos-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORCHESTRATEOS_DEMO_KEY: ${{ secrets.ORCHESTRATEOS_DEMO_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # Kernel ingress webhook: POST /ingress/webhook with X-Ingress-Secret header
          INGRESS_WEBHOOK_SECRET: ${{ secrets.INGRESS_WEBHOOK_SECRET }}
          # Cron auth for nurture tick + manual queue drain; also used by scheduled queue drain
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # LLM failover (Workers AI is primary; keys enable openai/anthropic in provider chain)
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
        run: |
          set -euo pipefail
          npx wrangler secret put API_KEYS_JSON < .api-keys.json
          if [ -n "${SESSION_SECRET:-}" ]; then
            printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          else
            echo "::warning::SESSION_SECRET not set — magic-link login will fail until configured"
          fi
          if [ -n "${RESEND_API_KEY:-}" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "::warning::RESEND_API_KEY not set — outbound email disabled"
          fi
          if [ -n "${NOTIFY_EMAIL:-}" ]; then
            printf '%s' "$NOTIFY_EMAIL" | npx wrangler secret put NOTIFY_EMAIL
          fi
          if [ -n "${ADMIN_EMAILS:-}" ]; then
            printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS
          fi
          if [ -n "${SITE_URL:-}" ]; then
            printf '%s' "$SITE_URL" | npx wrangler secret put SITE_URL
          fi
          if [ -n "${ORCHESTRATEOS_DEMO_KEY:-}" ]; then
            printf '%s' "$ORCHESTRATEOS_DEMO_KEY" | npx wrangler secret put DEMO_OPERATOR_KEY
          fi
          if [ -n "${INGRESS_WEBHOOK_SECRET:-}" ]; then
            printf '%s' "$INGRESS_WEBHOOK_SECRET" | npx wrangler secret put INGRESS_WEBHOOK_SECRET
          fi
          if [ -n "${CRON_SECRET:-}" ]; then
            printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET
          fi
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
          fi
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          fi
          if [ -n "${AI_GATEWAY_URL:-}" ]; then
            printf '%s' "$AI_GATEWAY_URL" | npx wrangler secret put AI_GATEWAY_URL
          fi

      - name: Deploy API worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: deploy

      - name: Smoke test API
        working-directory: cloudflare/workers/orchestrateos-api
        env:
          ORCHESTRATEOS_API_KEY: ${{ secrets.ORCHESTRATEOS_API_KEY }}
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          set -euo pipefail
          SMOKE_KEY=$(node scripts/merge-api-keys.mjs --print-runner)
          echo "Using runner key from GitHub secrets (length ${#SMOKE_KEY})"
          http_code() {
            curl -sS -o /tmp/smoke-body -w "%{http_code}" "$@"
          }
          for attempt in 1 2 3 4 5 6; do
            sleep 5
            HEALTH=$(http_code "${{ env.WORKER_API_URL }}/health")
            echo "health HTTP ${HEALTH}"
            test "$HEALTH" = "200"
            START=$(http_code -X POST "${{ env.WORKER_API_URL }}/start_run" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${SMOKE_KEY}" \
              -d '{"workflow_name":"ci_smoke_sdk","metadata":{"ci":true}}')
            BODY=$(cat /tmp/smoke-body)
            echo "start_run HTTP ${START} (attempt ${attempt}/6): ${BODY}"
            if [ "$START" = "200" ]; then
              RUN_ID=$(echo "$BODY" | grep -oE '"run_id":"[^"]+"' | cut -d'"' -f4)
              test -n "$RUN_ID"
              break
            fi
          done
          test -n "${RUN_ID:-}"
          curl -fsS -H "Authorization: Bearer ${SMOKE_KEY}" \
            "${{ env.WORKER_API_URL }}/runs/${RUN_ID}" | grep -qi "ci_smoke_sdk"
          curl -fsS -H "Authorization: Bearer ${SMOKE_KEY}" \
            "${{ env.WORKER_API_URL }}/runs/${RUN_ID}/replay" | grep -qi "replay_from_index"
