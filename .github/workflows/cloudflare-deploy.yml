name: Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "vite.config.ts"
      - ".env.orchestrateos"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  MAIN_PAGES_URL: https://aitechpros-website.pages.dev
  ORCHESTRATEOS_PAGES_URL: https://orchestrateos.pages.dev
  WORKER_API_URL: https://orchestrateos-api.nevaquit.workers.dev

jobs:
  pages-main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy main site (Pages)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SITE_URL: https://aitechpros-website.pages.dev

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=aitechpros-website

  pages-orchestrateos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy OrchestrateOS (Pages)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:orchestrateos
        env:
          VITE_ORCHESTRATEOS_DEMO_KEY: ${{ secrets.ORCHESTRATEOS_DEMO_KEY }}

      - name: Publish OrchestrateOS to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=orchestrateos

      - name: Smoke test OrchestrateOS site
        run: curl -fsS "${{ env.ORCHESTRATEOS_PAGES_URL }}/" | grep -qi "<!doctype html"

  worker:
    runs-on: ubuntu-latest
    name: Deploy Worker API
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install worker dependencies
        working-directory: cloudflare/workers/orchestrateos-api
        run: npm ci

      - name: Apply D1 schema (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/schema.sql

      - name: Apply D1 governance migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0003_governance.sql

      - name: Apply D1 platform migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0004_platform.sql

      - name: Apply D1 tenant migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0005_tenant.sql

      - name: Apply D1 tenant backfill (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0006_tenant_backfill.sql

      - name: Apply D1 nurture migration (remote)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/migrations/0007_nurture.sql

      - name: Seed D1 demo runs
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/seed.sql

      - name: Sync Worker API secrets
        working-directory: cloudflare/workers/orchestrateos-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORCHESTRATEOS_API_KEY: ${{ secrets.ORCHESTRATEOS_API_KEY }}
          ORCHESTRATEOS_DEMO_KEY: ${{ secrets.ORCHESTRATEOS_DEMO_KEY }}
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${ORCHESTRATEOS_API_KEY:-}" ] && [ -z "${API_KEYS_JSON:-}" ]; then
            echo "::error::Set ORCHESTRATEOS_API_KEY or API_KEYS_JSON in GitHub secrets"
            exit 1
          fi
          node scripts/merge-api-keys.mjs | npx wrangler secret put API_KEYS_JSON
          if [ -n "${ORCHESTRATEOS_DEMO_KEY:-}" ]; then
            printf '%s' "$ORCHESTRATEOS_DEMO_KEY" | npx wrangler secret put DEMO_OPERATOR_KEY
          fi

      - name: Deploy API worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: deploy

      - name: Smoke test API
        working-directory: cloudflare/workers/orchestrateos-api
        env:
          ORCHESTRATEOS_API_KEY: ${{ secrets.ORCHESTRATEOS_API_KEY }}
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}
        run: |
          set -euo pipefail
          SMOKE_KEY=$(node scripts/merge-api-keys.mjs --print-runner)
          curl -fsS "${{ env.WORKER_API_URL }}/health"
          curl -fsS "${{ env.WORKER_API_URL }}/docs" | grep -qi "OrchestrateOS"
          curl -fsS "${{ env.WORKER_API_URL }}/demo/runs" | grep -qi '"scenario":"partial"'
          RUN_ID=$(curl -fsS -X POST "${{ env.WORKER_API_URL }}/start_run" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SMOKE_KEY}" \
            -d '{"workflow_name":"ci_smoke_sdk","metadata":{"ci":true}}' | grep -oE '"run_id":"[^"]+"' | cut -d'"' -f4)
          test -n "$RUN_ID"
          curl -fsS -H "Authorization: Bearer ${SMOKE_KEY}" \
            "${{ env.WORKER_API_URL }}/runs/${RUN_ID}" | grep -qi "ci_smoke_sdk"
          curl -fsS -H "Authorization: Bearer ${SMOKE_KEY}" \
            "${{ env.WORKER_API_URL }}/runs/${RUN_ID}/replay" | grep -qi "replay_from_index"
