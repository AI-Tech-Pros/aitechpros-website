name: Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "cloudflare/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "vite.config.ts"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_URL: https://aitechpros-website.pages.dev
  WORKER_API_URL: https://orchestrateos-api.nevaquit.workers.dev

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy Pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build:pages
        env:
          VITE_SITE_URL: https://aitechpros-website.pages.dev
          VITE_ORCHESTRATEOS_API_URL: https://orchestrateos-api.nevaquit.workers.dev

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/public --project-name=aitechpros-website

  worker:
    runs-on: ubuntu-latest
    name: Deploy Worker API
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install worker dependencies
        working-directory: cloudflare/workers/orchestrateos-api
        run: npm ci

      - name: Apply D1 schema (remote)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: d1 execute orchestrateos --remote --file=../../d1/schema.sql

      - name: Deploy API worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workers/orchestrateos-api
          command: deploy

      - name: Smoke test API
        run: curl -fsS "${{ env.WORKER_API_URL }}/health"
