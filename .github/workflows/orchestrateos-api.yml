name: OrchestrateOS API

on:
  push:
    branches: [main]
    paths:
      - "resume_engine/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/orchestrateos-api.yml"
  pull_request:
    paths:
      - "resume_engine/**"
      - "pyproject.toml"
      - "requirements.txt"

env:
  IMAGE_NAME: orchestrateos-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[api,dev]"

      - name: Run unit tests
        run: pytest resume_engine/tests -v

      - name: Run API tests
        run: pytest resume_engine/tests/test_api.py -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f resume_engine/Dockerfile -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name api-test -p 8000:8000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/start_run \
            -H "Content-Type: application/json" \
            -d '{"workflow_name":"ci_smoke"}'
          docker logs api-test
          docker stop api-test

  publish:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/orchestrateos-api
          IMAGE_LC=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          docker build -f resume_engine/Dockerfile -t ${IMAGE_LC}:latest -t ${IMAGE_LC}:${{ github.sha }} .
          docker push ${IMAGE_LC}:latest
          docker push ${IMAGE_LC}:${{ github.sha }}
